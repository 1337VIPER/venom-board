<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Illustration of the Venom Board panel: a filter bar, a project picker, tasks grouped by project with a colour per discipline, status and due date, Start and Done buttons, and a status line.</title>
  <rect width="420" height="470" rx="10" fill="#1f1f24"/>
  <rect x="0" y="0" width="420" height="30" rx="10" fill="#26262c"/>
  <rect x="0" y="20" width="420" height="10" fill="#26262c"/>
  <text x="14" y="20" fill="#e6e6e6" font-weight="600">Venom Board</text>

  <!-- toolbar -->
  <g fill="#cfcfcf">
    <circle cx="24" cy="50" r="7" fill="none" stroke="#cfcfcf" stroke-width="2"/>
    <path d="M29 44 l3 -2 l0 5 z"/>
    <rect x="40" y="38" width="226" height="24" rx="4" fill="#141418" stroke="#3a3a42"/>
    <text x="50" y="55" fill="#7c7c86">Filter tasks</text>
    <rect x="274" y="38" width="96" height="24" rx="4" fill="#2c2c33"/>
    <text x="284" y="55">Any status ▾</text>
    <rect x="378" y="38" width="28" height="24" rx="4" fill="#2c2c33"/>
    <text x="386" y="55">⚙</text>
  </g>
  <!-- scope -->
  <rect x="14" y="70" width="270" height="24" rx="4" fill="#2c2c33"/>
  <text x="24" y="87" fill="#cfcfcf">All projects ▾</text>
  <rect x="294" y="75" width="14" height="14" rx="3" fill="#141418" stroke="#55555f"/>
  <text x="314" y="87" fill="#7c7c86">Unassigned too</text>

  <!-- list -->
  <rect x="14" y="102" width="392" height="262" rx="4" fill="#141418" stroke="#2c2c33"/>
  <g fill="#e6e6e6">
    <text x="24" y="124" font-weight="700">▾ Vertical slice · Night Keep Studio (5)</text>

    <rect x="36" y="135" width="10" height="10" fill="#3dff8b"/>
    <text x="54" y="145">Boss arena blockout</text>
    <text x="262" y="145" fill="#9d99aa">To do</text>
    <text x="320" y="145" fill="#ff2a4f">3 days late</text>

    <rect x="30" y="155" width="370" height="22" fill="#103a5c"/>
    <rect x="36" y="161" width="10" height="10" fill="#2fd6ff"/>
    <text x="54" y="171">Parry timing pass</text>
    <text x="262" y="171" fill="#9d99aa">Doing</text>
    <text x="320" y="171">Today</text>

    <rect x="36" y="187" width="10" height="10" fill="#a66bff"/>
    <text x="54" y="197">Knight idle animation</text>
    <text x="262" y="197" fill="#9d99aa">To do</text>
    <text x="320" y="197">In 2 days</text>

    <rect x="36" y="213" width="10" height="10" fill="#ff7a1a"/>
    <text x="54" y="223">Camera clips through walls</text>
    <text x="262" y="223" fill="#9d99aa">To do</text>
    <text x="320" y="223">In 5 days</text>

    <rect x="36" y="239" width="10" height="10" fill="#ffd23d"/>
    <text x="54" y="249">Footstep sounds</text>
    <text x="262" y="249" fill="#9d99aa">To do</text>

    <text x="24" y="279" font-weight="700">▾ Menus and HUD · Night Keep Studio (2)</text>
    <rect x="36" y="290" width="10" height="10" fill="#ff7a1a"/>
    <text x="54" y="300">Pause menu flow</text>
    <text x="262" y="300" fill="#9d99aa">Blocked</text>
    <text x="320" y="300">Tomorrow</text>
    <rect x="36" y="316" width="10" height="10" fill="#ff4fd8"/>
    <text x="54" y="326">Health bar shader</text>
    <text x="262" y="326" fill="#9d99aa">To do</text>
    <text x="320" y="326">2026-10-17</text>

    <text x="24" y="354" font-weight="700">▸ Jam entry · Jam Crew (1)</text>
  </g>

  <!-- actions -->
  <rect x="14" y="374" width="64" height="26" rx="4" fill="#3a3a42"/>
  <text x="32" y="392" fill="#e6e6e6">Start</text>
  <rect x="84" y="374" width="64" height="26" rx="4" fill="#3a3a42"/>
  <text x="102" y="392" fill="#e6e6e6">Done</text>
  <text x="14" y="424" fill="#9d99aa">8 tasks, 1 overdue. Updated 14:05.</text>
  <text x="406" y="458" fill="#55555f" font-size="11" text-anchor="end">Illustration</text>
</svg>
